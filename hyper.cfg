# Test config file for Hyper, mostly yoinked from the Hyper repo with some modifications
default-entry = "Test OS with Shill prekernel"

[Test OS with Shill prekernel]
protocol = ultra

cmdline  = "--test-arg"

binary:
    path              = "/shill"
    allocate-anywhere = true

module:
    name = "SHILL_KERNEL_IMAGE_START"
    # /kernel or /kernel.gz are available in sysroot,
    # use depending on whether you want to test with compression
    path = "::/kernel.gz"

# this module, unlike the other kernel one, is a test which is not necessary
module:
    name = "test module (non compressed)"
    path = "::/testmodule.txt"
module:
    name = "test module (compressed)"
    path = "::/testmodule.txt.gz"

video-mode:
    width=1024
    height=768
    bpp=32
    format=xrgb8888
